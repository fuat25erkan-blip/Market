
name: Market APK Derleme

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Market_Telefondan_APK_Hazir.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android proje dosyalarini ac
        run: |
          set -eu
          unzip -o Market_Telefondan_APK_Hazir.zip -d kaynak
          PROJE=$(find kaynak -type f -name settings.gradle -print -quit)
          if [ -z "$PROJE" ]; then
            echo "HATA: settings.gradle bulunamadi."
            exit 1
          fi
          echo "PROJE_DIZINI=$(dirname "$PROJE")" >> "$GITHUB_ENV"

      - name: APK olustur
        run: |
          cd "$PROJE_DIZINI"
          gradle --no-daemon assembleDebug

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Market-APK
          path: kaynak/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
